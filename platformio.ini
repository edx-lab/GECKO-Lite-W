; Gecko Lite W - ESP32-S3-N16R8 only.
; ST7789V 240x320 RGB, separate TFT/SD SPI buses and GPIO controls.
; Wiring: boards/esp32-s3-n16r8/README.md

[platformio]
default_envs = esp32-s3-n16r8
build_cache_dir = .pio/buildcache
cache_dir = .pio/cache
boards_dir = boards/_boards_json

[env:esp32-s3-n16r8]
board = esp32-s3-n16r8
board_build.variants_dir = boards
board_build.partitions = custom_16Mb.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip ; Arduino 3.3.9 for 10
platform_packages = framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/builds/main_esp32-arduino-libs-20260715-140131.tar.gz ; Arduino 3.3.10 with exFAT support

monitor_filters = esp32_exception_decoder, send_on_enter, colorize
monitor_speed = 115200
framework = arduino
board_build.filesystem = littlefs
build_src_flags =
	; warnings:
	-Wall
	-Wclobbered
	-Wempty-body
	-Wignored-qualifiers
	; -Wmissing-field-initializers
	; -Wsign-compare ; commented because it produces too much warnings, some of them are imposible to fix due to external deps
	-Woverloaded-virtual=0
	-Wtype-limits
	-Wno-unused-label
	-Wno-comment
	-Wno-unused-variable
	-Wno-narrowing
	-D ENABLE_RAM_LOGGING=1
	; warnings end

; build_unflags = -Os ; uncomment this line and "-O2" for speed optimisations, but bigger size

; Specify the path to your 32bits GCC compiler here, if it was not detected
;mqjs_host_cc = C:/MinGW/bin/gcc.exe

build_src_filter =
	+<*>
	-<.git/>
	-<.svn/>
	-<modules/bjs_interpreter/mqjs_stdlib.c>

build_flags =
    -Iboards/esp32-s3-n16r8
    -DBOARD_HAS_PSRAM=1
    -DUSB_as_HID=1
    -DCORE_DEBUG_LEVEL=0
    -DDEVICE_NAME='"Gecko Lite W"'
    -DHAS_SCREEN=1
    -DHAS_5_BUTTONS=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=0 ; BGR: correct swapped red/blue on the fitted ST7789V panel
    -DTFT_INVERSION_ON
    -DROTATION=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DLOAD_GLCD=1
    -DSMOOTH_FONT=1
	-DBRUCE_VERSION='"dev"'
	-DEEPROMSIZE=128
	-DLH=8
	-DLW=6
	-flto
	-ffunction-sections
	-fdata-sections
	-Os
	-Wl,--print-memory-usage
	-Wl,--gc-sections
	-DGIT_COMMIT_HASH='"Homebrew"'
	-DFASTLED_RMT_BUILTIN_DRIVER=1 	; https://github.com/FastLED/FastLED/blob/67436be11fc3b7be611cdf9011f31c4f76817741/src/platforms/esp/32/rmt_4/idf4_clockless_rmt_esp32.h#L25-L33
	-Werror=odr	; Treats One Definition Rule violations as errors in LTO builds
	-D CONFIG_ASYNC_TCP_STACK_SIZE=4096	; Reduces stack size for Async TCP to save memory
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=1  ;
	-DCONFIG_ASYNC_TCP_USE_WDT=0	   ; Disables the Watchdog timer on Async TCP, to avoid restartings during file uploads
	-DGEN_MQJS_HEADERS		; Enable generation of mquickjs headers
	; mbedtls settings for crypto operations (WhisperPair/audio exploits)
	-DMBEDTLS_CONFIG_FILE=\"mbedtls/esp_config.h\"
	-DCONFIG_MBEDTLS_ECDH_C=1
	-DCONFIG_MBEDTLS_AES_C=1
	-DCONFIG_MBEDTLS_CTR_DRBG_C=1
	; Additional mbedtls flags that could be useful:
	;-DCONFIG_MBEDTLS_ECP_C=1
	;-DCONFIG_MBEDTLS_SHA256_C=1
	;-DCONFIG_MBEDTLS_SHA512_C=1
	;-DCONFIG_MBEDTLS_HKDF_C=1
	;-DCONFIG_MBEDTLS_GCM_C=1

extra_scripts =
	pre:patch.py
	pre:pre_build_current_year.py
	pre:gen_mqjs_headers.py
	pre:patch_library_conflicts.py
	flto_prep.py
	post:build.py

lib_deps =
	https://github.com/sayacom/WireGuard-ESP32-Arduino#90aa6b43965c9718d62e59ddd709f856722f8e0b
	;WireGuard-ESP32
	paulstoffregen/Time@1.6.1
	ewpa/LibSSH-ESP32@5.9.0
	Adafruit BusIO=https://github.com/emericklaw/Adafruit-BusIO_Bruce#27230c1ddbb3983e1bd5abc025fcc84f6a8c2c5e
	https://github.com/rennancockles/SimpleCLI#b23d377935c80cc5a9214bcf24e1f1cf68debc6a
	NTPClient@3.2.1
	fbiego/ESP32Time@2.0.6
	bblanchon/ArduinoJson@7.4.3
	earlephilhower/ESP8266Audio@2.4.1
	earlephilhower/ESP8266SAM@1.1.0
	tinyu-zhao/FFT@0.0.1
	h2zero/NimBLE-Arduino@2.5.1
	Bodmer/JPEGDecoder@2.0.0
	mquickjs=https://github.com/BruceDevices/mquickjs#169b5ea7723bf43d7be9631a14f9c2a1ed8c69e1
	;paulstoffregen/OneWire@^2.3.8
	https://github.com/bmorcelli/OneWire#42e045e0f8c6a4dd8bfb8917f58c5b38585f6b1e
	;jackjansen/esp32_idf5_https_server_compat
	https://github.com/bmorcelli/ESP32-PsRamFS#5ace2e66c10d5647f10f48b22a79d9b12a73db7b
	;chegewara/EspTinyUSB
	bitbank2/AnimatedGIF@2.2.3
	bitbank2/PNGdec@1.1.6
	ESP32Async/ESPAsyncWebServer@3.12.1
	ESP32Async/AsyncTCP@3.5.0
	fastled/FastLED@3.10.3
