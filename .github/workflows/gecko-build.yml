name: Gecko Lite W - build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Clean build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python tools/test_build_scripts.py
      - run: python tools/audit_gecko.py
      - run: python -m platformio run -e esp32-s3-n16r8
      - run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Gecko-Lite-W-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
